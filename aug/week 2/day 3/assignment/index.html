<!DOCTYPE html>
<html>
<head>
    <title>Simple Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="forms">

        <div class="box">
            <h3>DO:</h3>

            <label>Name</label>
            <input type="text" placeholder="Name">

            <label>Email</label>
            <input type="text" placeholder="Email">

            <label>Company</label>
            <input type="text" placeholder="Company">
        </div>


        <div class="box">
            <h3>DON'T:</h3>

            <label>Name</label>
            <input type="text" placeholder="Name">

            <label>Email</label>
            <input type="text" placeholder="Email">

            <label>Company</label>
            <input type="text" placeholder="Company">
        </div>

    </div>


    <div class="card">

        <div class="image">
            🖼️
        </div>

        <div class="content">
            <span>Label</span>

            <h2>Heading</h2>

            <p>This is a short description about the card.</p>

            <button>Action</button>
        </div>

    </div>

</body>
</html>
