<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>
<body>

    <h1>Student Registration</h1>

    <form class="register">

        <input type="text" placeholder="Enter your name"><br><br>

        <input type="email" placeholder="Enter your email"><br><br>

        <input type="number" placeholder="Enter your phone"><br><br>

        <input type="date"><br><br>

        <input type="text" placeholder="Enter your gender"><br><br>

        <textarea placeholder="Enter your address"></textarea><br><br>

        <input type="password" placeholder="Enter your password"><br><br>

        <button>Register</button>

    </form>

    <br>

    <button class="show">Show Details</button>

    <div class="show-container"></div>

    <script src="script.js"></script>
</body>
</html>
