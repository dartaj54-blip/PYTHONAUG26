<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h2>Basic form design using HTML</h2>

<form>

<fieldset>

<legend>Personal Details</legend>

<label>First name :</label>
<input type="text">
<br><br>

<label>Last name :</label>
<input type="text">
<br><br>

<label>Gender :</label>

<input type="radio" name="gender">
<label>Male</label>

<input type="radio" name="gender">
<label>Female</label>

<br><br>

<label>Email :</label>
<input type="email">
<br><br>

<label>Date of Birth :</label>
<input type="date">
<br><br>

<label>Address :</label>
<br>
<textarea rows="5" cols="30"></textarea>

<br><br>

<input type="submit" value="Submit">

</fieldset>

</form>

</body>
</html>
